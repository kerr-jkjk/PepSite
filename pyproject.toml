[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pepsite"
version = "0.1.0"
description = "Receptor-site-aware peptide binder generation with masked language modeling"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.23",
    "pandas>=1.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.2",
    "torch>=2.0",
    "transformers>=4.30,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
